; Vetőgép ISOBUS vezérlő – ESP32-S3
;   waveshare_8di8ro  – Waveshare ESP32-S3-ETH-8DI-8RO-C (16 MB flash, CAN GPIO17/18, 8 bemenet, 8 relé, Ethernet)
;   rcv17_16mb        – ESP32S3 RCv1.7 (AgOpenGPS Rate Controller panel) – kisebb tudású második panel
[platformio]
default_envs = waveshare_8di8ro, rcv17_16mb

[env:waveshare_8di8ro]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf
; rögzített AgIsoStack++ verzió (ugyanez a host/CMakeLists.txt-ben)
lib_deps = https://github.com/Open-Agriculture/AgIsoStack-plus-plus.git#3e37ba629b53b565fa80c63feaed027a9156d3b9

board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_upload.maximum_size = 7340032
board_build.flash_mode = dio
board_build.partitions = partitions_16mb.csv
; a generált VT object pool és a webes felület a firmware-be ágyazva
board_build.embed_files = generated/object_pool.iop
board_build.embed_txtfiles = web/index.html

build_flags =
  -Wno-error=missing-field-initializers
  -DSEEDER_FW_VERSION=\"2.4.0\"

build_type = release
upload_protocol = esptool
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

; ESP32S3 RCv1.7 (AgOpenGPS Rate Controller panel, Vági F. / Gunics B.): ESP32-S3-WROOM-1U, 16 MB, PSRAM NINCS.
; „Kisebb tudású” vetőgép-panel: 2 motor (PWM + DIR) enkóderrel, 2 tartály, munkakapcsoló, kerék / turbina /
; leforgató gomb szabad lábakon, kimenetek a PCA9685-ön, Ethernet. CAN TX17 / RX16 (MCP2562).
; Első feltöltés előtt a flash VDD_SPI eFuse-t 3,3 V-ra kell égetni (docs/HARDVER_RCV17_HU.md).
[env:rcv17_16mb]
extends = env:waveshare_8di8ro
board_build.cmake_extra_args = "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.rcv17.defaults"
build_flags =
  -Wno-error=missing-field-initializers
  -DSEEDER_FW_VERSION=\"2.4.0\"
  -DSEEDER_BOARD_RCV17=1
